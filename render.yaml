services:
  # Web Servisi: Hem Flask uygulamasını hem de zamanlayıcıyı çalıştırır.
  - type: web
    name: uzay-agent
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'main:app'"
    envVars:
      - fromGroup: uzay-agent-secrets

# Ortam Değişkenleri Grubu: Tüm API anahtarları ve şifreler burada saklanır.
envVarGroups:
  - name: uzay-agent-secrets
    envVars:
      - key: WORDPRESS_URL
        value: "" # Burayı Render'da dolduracaksınız
      - key: WORDPRESS_USER
        value: "" # Burayı Render'da dolduracaksınız
      - key: WORDPRESS_APP_PASSWORD
        value: "" # Burayı Render'da dolduracaksınız
      - key: GEMINI_API_KEY
        value: "" # Burayı Render'da dolduracaksınız
      - key: NASA_API_KEY
        value: "" # Burayı Render'da dolduracaksınız
      - key: GOOGLE_API_KEY
        value: "" # Burayı Render'da dolduracaksınız
      - key: GOOGLE_SEARCH_ENGINE_ID
        value: "" # Burayı Render'da dolduracaksınız
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        value: "" # Burayı .json dosyanızın içeriğiyle dolduracaksınız
